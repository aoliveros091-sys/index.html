<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uranium Games</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☢️</text></svg>">
<style>
:root {
  --primary: #00ff88;
  --primary-rgb: 0, 255, 136;
  --bg: #0a0e1a;
  --card-bg: rgba(10, 20, 30, 0.85);
  --glow: 0.35;
  --blur: 12px;
  --card-radius: 18px;
  --font-scale: 1;
  --anim-strength: 1;
  --wallpaper-overlay: radial-gradient(circle at 20% 50%,rgba(var(--primary-rgb),0.12) 0%,transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(var(--primary-rgb),0.10) 0%,transparent 50%),
    radial-gradient(circle at 40% 20%,rgba(var(--primary-rgb),0.06) 0%,transparent 40%);
}

/* existing styles unchanged ... */

/* NEW: Online users + favorites */
.site-stats {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin: 10px 0 0;
  font-size: 0.86em;
  color: rgba(var(--primary-rgb), 0.8);
}
.stat-pill {
  padding: 8px 14px;
  border-radius: 999px;
  border: 1px solid rgba(var(--primary-rgb), 0.28);
  background: rgba(10,20,30,0.8);
  box-shadow: 0 0 12px rgba(var(--primary-rgb), 0.12);
}

.favorite-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 3;
  width: 34px;
  height: 34px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 1.05em;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.favorite-btn:hover {
  transform: scale(1.08);
}
.favorite-btn.active {
  background: var(--primary);
  color: #000;
  box-shadow: 0 0 16px rgba(var(--primary-rgb), 0.45);
}

/* ensure card can position favorite button */
.game-card {
  position: relative;
}

/* NEW favorites filter */
.filter-btn[data-filter="favorites"] {
  border-color: rgba(255, 215, 0, 0.35);
}
.filter-btn[data-filter="favorites"].active {
  background: gold;
  color: #000;
  border-color: gold;
}
</style>
</head>
<body>
<div class="floating-particles" id="particles"></div>

<div class="container">
  <header>
    <div class="clock-wrap">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate">---</div>
    </div>
    <h1 id="mainTitle">☢️ URANIUM</h1>
    <p class="tagline" id="mainTagline">Play hundreds of games instantly</p>
    <p class="status-line" id="statusLine">Loading…</p>

    <!-- NEW online users display -->
    <div class="site-stats">
      <div class="stat-pill">👥 Online Users: <span id="onlineUsersCount">0</span></div>
      <div class="stat-pill">⭐ Favorites: <span id="favoritesCount">0</span></div>
    </div>
  </header>

  <div class="top-controls">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search games…" autocomplete="off">
    </div>
    <div class="apps-wrap">
      <button class="settings-btn" id="appsBtn" type="button">📱 Apps</button>
      <div class="apps-dropdown" id="appsDropdown">
        <button type="button" onclick="window.open('https://discord.gg/9TqZVcfvh4','_blank','noopener,noreferrer'); closeAppsDropdown();">
          <span class="app-emoji">💬</span> Discord
        </button>
        <button type="button" onclick="openApp('Uranium AI', 'https://cdn.jsdelivr.net/gh/Onex558/mercury-movies-@main/myaithe%20bestai.html'); closeAppsDropdown();">
          <span class="app-emoji">🤖</span> Uranium AI
        </button>
        <button type="button" onclick="openApp('Movies', 'https://cinera.cc/'); closeAppsDropdown();">
          <span class="app-emoji">🎬</span> Movies
        </button>
      </div>
    </div>
    <button class="settings-btn" id="openSettings">Settings</button>
  </div>

  <div class="filter-bar" id="filterBar"></div>
  <div id="gameCount" class="game-count">— Games</div>
  <div class="games-grid" id="gamesGrid">
    <div class="loading-state">
      <div class="spinner"></div>
      <div>Loading…</div>
    </div>
  </div>
</div>

<!-- keep the rest of your original modal/settings/announcement HTML exactly the same -->

<script>
/* keep your existing JS, then add these pieces */

const DEFAULTS = {
  /* your existing defaults ... */
  favorites: []
};

let favorites = loadFavorites();

function loadFavorites() {
  try {
    const raw = localStorage.getItem('uraniumFavorites');
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}
function saveFavorites() {
  localStorage.setItem('uraniumFavorites', JSON.stringify(favorites));
  updateFavoritesCount();
}

function isFavorite(game) {
  return favorites.includes(game.resolvedUrl);
}
function toggleFavorite(game) {
  const idx = favorites.indexOf(game.resolvedUrl);
  if (idx >= 0) favorites.splice(idx, 1);
  else favorites.push(game.resolvedUrl);
  saveFavorites();
  handleSearch();
}

function updateFavoritesCount() {
  const el = document.getElementById('favoritesCount');
  if (el) el.textContent = favorites.length;
}

/* NEW: online users counter
   This is local-browser based unless you connect it to a backend.
   It simulates presence so the UI works in pure HTML.
*/
function updateOnlineUsers() {
  const key = 'uraniumPresence';
  const now = Date.now();
  let peers = [];

  try {
    peers = JSON.parse(localStorage.getItem(key) || '[]');
  } catch {
    peers = [];
  }

  peers = peers.filter(t => now - t < 15000);
  peers.push(now);
  localStorage.setItem(key, JSON.stringify(peers));

  const el = document.getElementById('onlineUsersCount');
  if (el) el.textContent = Math.max(1, peers.length);
}

window.addEventListener('storage', () => {
  updateOnlineUsers();
  updateFavoritesCount();
});

/* PATCH renderGames so it adds favorite button */
const originalRenderGames = renderGames;
renderGames = function(list) {
  gameCountEl.textContent = list.length + ' Games';
  gamesGrid.innerHTML = '';
  if (list.length === 0) {
    gamesGrid.innerHTML = '<div class="loading-state">No games match your search.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  list.forEach((game, i) => {
    const card = document.createElement('a');
    card.href = '#';
    card.className = 'game-card';
    card.style.animationDelay = (Math.min(i, 30) * 0.025) + 's';

    const sourceBadge = game.source === 'gnmath'
      ? '<span style="font-size:0.65em;opacity:0.55;letter-spacing:0.5px;">GN Math</span>'
      : '<span style="font-size:0.65em;opacity:0.55;letter-spacing:0.5px;">Uranium</span>';

    const favActive = isFavorite(game) ? 'active' : '';
    const favIcon = isFavorite(game) ? '★' : '☆';

    card.innerHTML = `
      <button class="favorite-btn ${favActive}" type="button" aria-label="Favorite game">${favIcon}</button>
      <div class="game-image">
        <img src="${game.resolvedCover || ''}" alt="${game.name}" loading="lazy"
          onerror="this.style.display='none';this.parentElement.querySelector('.fallback').style.display='flex';">
        <div class="fallback">NO IMAGE<br>${game.name}</div>
      </div>
      <div class="game-info">
        <div class="game-title">${game.name}</div>
        <div class="game-author">${game.author || 'Unknown'} · ${sourceBadge}</div>
      </div>`;

    card.onclick = e => {
      if (e.target && e.target.classList.contains('favorite-btn')) return;
      e.preventDefault();
      openGame(game);
    };

    card.querySelector('.favorite-btn').onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(game);
    };

    frag.appendChild(card);
  });
  gamesGrid.appendChild(frag);
};

/* PATCH filter bar to add Favorites */
const originalBuildFilterBar = buildFilterBar;
buildFilterBar = function() {
  const filters = [
    { id: 'all', label: 'All' },
    { id: 'favorites', label: 'Favorites' },
    { id: 'uranium', label: 'Uranium' },
    { id: 'gnmath', label: 'GN Math' },
    { id: 'flash', label: 'Flash' },
    { id: 'port', label: 'Ports' },
    { id: 'emulator', label: 'Emulator' },
    { id: 'fnf', label: 'FNF' }
  ];
  filterBar.innerHTML = '';
  filters.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (currentFilter === f.id ? ' active' : '');
    btn.textContent = f.label;
    btn.dataset.filter = f.id;
    btn.onclick = () => {
      currentFilter = f.id;
      filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === currentFilter));
      handleSearch();
    };
    filterBar.appendChild(btn);
  });
};

/* PATCH handleSearch for Favorites */
const originalHandleSearch = handleSearch;
handleSearch = function() {
  const query = searchInput.value.toLowerCase().trim();
  let results = allGames;

  if (currentFilter === 'favorites') {
    results = results.filter(g => favorites.includes(g.resolvedUrl));
  } else if (currentFilter === 'uranium') {
    results = results.filter(g => g.source === 'uranium');
  } else if (currentFilter === 'gnmath') {
    results = results.filter(g => g.source === 'gnmath');
  } else if (['flash', 'port', 'emulator', 'fnf'].includes(currentFilter)) {
    results = results.filter(g => Array.isArray(g.special) && g.special.includes(currentFilter));
  }

  if (query) {
    const tokens = query.split(/\s+/);
    results = results.filter(g => {
      const target = `${g.name} ${g.author || ''}`.toLowerCase();
      return tokens.every(t => target.includes(t));
    });
  }

  renderGames(results);
};

/* init counters */
updateFavoritesCount();
updateOnlineUsers();
setInterval(updateOnlineUsers, 5000);

/* keep all your existing startup code */
</script>
</body>
</html>
